# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric / Minecraft versions.
# Check https://fabricmc.net/develop/ for the latest builds for 1.21.11 and bump if needed.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.3
loader_version=0.18.2
loom_version=1.14-SNAPSHOT
fabric_version=0.139.4+1.21.11

# Mod. Bump BOTH on every build: V0.6Beta -> V0.7Beta -> ... -> V1.0 (no "Beta" from V1 on).
# mod_version must be valid semver (it goes into fabric.mod.json); release_label is shown in the GUI
# and names the jar: VoidClient_<release_label>.jar
mod_version=0.7.0-beta
release_label=V0.7Beta
maven_group=com.mytestclient
archives_base_name=voidclient
